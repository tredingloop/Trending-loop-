<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corematrix - Enrollment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Corematrix</h2>
        <p>Enroll as Beginner & Start Training</p>
        
        <form id="enrollForm">
            <div class="input-group">
                <label>Mobile Number / Email</label>
                <input type="text" id="userInput" required placeholder="Enter number or email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="passwordInput" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn">Start Training</button>
        </form>
        <p id="errorMessage" style="color: #f43f5e; margin-top: 12px; font-size: 14px; font-weight: 600;"></p>
    </div>

    <!-- Firebase Legacy Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Tere credentials pre-configured hain
        const firebaseConfig = { 
            apiKey: "AIzaSyD0pWvaqGlQH93w3ddooHQ6Yq1-6GHus6w", 
            authDomain: "trending-loop.firebaseapp.com", 
            projectId: "trending-loop", 
            storageBucket: "trending-loop.firebasestorage.app",
            messagingSenderId: "206395963563", 
            appId: "1:206395963563:web:5bba53723d14c8af139fee"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('enrollForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const identity = document.getElementById('userInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMessage');

            errorMsg.textContent = "Creating profile...";

            // Seedha Firestore database me insert logic without Auth dependency
            db.collection("enrollments").add({
                identity: identity,
                password: password,
                utr: "Not Submitted",
                status: "Pending Verification",
                createdAt: new Date()
            })
            .then((docRef) => {
                // Tracking ke liye document ID browser internal memory me daal rhe hain
                localStorage.setItem("myEnrollId", docRef.id);
                window.location.href = "dashboard.html";
            })
            .catch((error) => {
                errorMsg.textContent = "Database Error: " + error.message;
            });
        });
    </script>
</body>
</html>
